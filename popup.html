<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>HouseGhost | Watch Netflix without household limits</title>
  <script type="module" crossorigin src="/chunks/popup.js"></script>
  <link rel="modulepreload" crossorigin href="/chunks/i18n.js">
  <link rel="stylesheet" crossorigin href="/assets/popup.css">
</head>
<body>
<div id="app">

  <!-- Header -->
  <header>
    <img src="/icons/HouseGhost-32.png" alt="HouseGhost" class="header-logo">
    <span>HouseGhost</span>
  </header>

  <!-- Status Card -->
  <div class="status-card">
    <div class="status-icon-wrap">
      <svg class="shield-icon" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
        <path d="M9 12l2 2 4-4"/>
      </svg>
    </div>
    <div class="status-info">
      <div class="status-title">Household Bypass</div>
      <div class="status-subtitle">
        <span class="live-pulse"></span>
        <span id="shieldStatusText">Protection Active</span>
      </div>
    </div>
  </div>

  <!-- Feature Pill -->
  <div class="feature-info-box">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#c084fc" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
      <path d="M9 12l2 2 4-4"/>
    </svg>
    <span>Seamless &amp; Uninterrupted Streaming</span>
  </div>

  <!-- Footer -->
  <footer>
    <span>Crafted by <strong class="author-highlight">x4abhi</strong></span> &bull; <span id="version">v1.0.0</span>
  </footer>

</div>
</body>
</html>
